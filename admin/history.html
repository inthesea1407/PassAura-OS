<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--
  CSP: same policy shape as admin/index.html. No inline script; the table is
  built by history.js (external, same-origin). style-src uses a hash for the
  one inline <style>; replace the sha256 after any edit.
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' https://cdn.jsdelivr.net 'sha256-REPLACE_WITH_SUPABASE_SRI_SCRIPT';
  style-src 'self' 'sha256-REPLACE_WITH_STYLE_HASH';
  connect-src https://*.supabase.co;
  img-src 'self' data:;
  font-src 'self';
  object-src 'none';
  base-uri 'none';
  form-action 'none';
  frame-ancestors 'none';
">
<title>PassAura Audit History</title>
<style>body{font:15px system-ui;max-width:1100px;margin:1rem auto;padding:0 1rem}
table{width:100%;border-collapse:collapse}
td,th{border-bottom:1px solid #eee;padding:4px;text-align:left;font-size:13px;word-break:break-all}
pre{background:#f5f5f5;padding:8px;white-space:pre-wrap}
.hide{display:none}
button,input,select{font:inherit;padding:4px 8px;margin:2px}
#msg{min-height:1.2em}</style>
</head>
<body>
<h1 data-i18n="title">PassAura Audit History</h1>
<div>
  <button id="langBtn" type="button">العربية</button>
  <a href="index.html" data-i18n="back">Back to panel</a>
</div>
<p id="msg" role="status" aria-live="polite"></p>

<section id="login">
  <h2 data-i18n="login">Owner login</h2>
  <input id="em" type="email" placeholder="email" autocomplete="username">
  <input id="pw" type="password" placeholder="password" autocomplete="current-password">
  <button id="doLogin" data-i18n="signIn">Sign in</button>
  <div id="mfa" class="hide">
    <input id="otp" placeholder="6-digit authenticator code" inputmode="numeric" autocomplete="one-time-code">
    <button id="doOtp" data-i18n="verify">Verify</button>
  </div>
</section>

<div id="app" class="hide">
  <section>
    <h2 data-i18n="history">Audit history (last 100)</h2>
    <button id="refresh" data-i18n="refresh">Refresh</button>
    <table id="histT">
      <thead>
        <tr>
          <th data-i18n="colTime">Time</th>
          <th data-i18n="colActor">Actor</th>
          <th data-i18n="colAction">Action</th>
          <th data-i18n="colTarget">Target</th>
          <th data-i18n="colDetails">Details</th>
        </tr>
      </thead>
      <tbody id="histBody"></tbody>
    </table>
  </section>
</div>

<!-- SRI-pinned supabase-js, same pin as index.html. -->
<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"
  integrity="sha384-REPLACE_WITH_REAL_SHA384_BASE64"
  crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="history.js"></script>
</body>
</html>
