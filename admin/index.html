<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--
  CSP hardened (F7/F18): no inline script, SRI-pinned supabase-js, no unsafe-eval.
  style-src hashed (the one inline <style> block) instead of 'unsafe-inline'.
  connect-src restricted to the project's Supabase domain only.
  If you change the inline <style>, recompute the sha256 in style-src below.
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' https://cdn.jsdelivr.net 'sha256-REPLACE_WITH_SUPABASE_SRI_SCRIPT';
  style-src 'self' 'sha256-REPLACE_WITH_STYLE_HASH';
  connect-src https://*.supabase.co;
  img-src 'self' data:;
  font-src 'self';
  object-src 'none';
  base-uri 'none';
  form-action 'none';
  frame-ancestors 'none';
">
<title>PassAura Owner Panel</title>
<style>body{font:15px system-ui;max-width:880px;margin:1rem auto;padding:0 1rem}section{border:1px solid #ccc;border-radius:8px;padding:1rem;margin:1rem 0}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #eee;padding:4px;text-align:left;font-size:13px;word-break:break-all}button,input,select{font:inherit;padding:4px 8px;margin:2px}pre{background:#f5f5f5;padding:8px;white-space:pre-wrap}.hide{display:none}</style>
</head>
<body>
<h1 data-i18n="title">PassAura Owner Panel</h1>
<div>
  <button id="langBtn" type="button">العربية</button>
</div>
<p id="msg" role="status" aria-live="polite"></p>

<section id="login">
  <h2 data-i18n="login">Owner login</h2>
  <input id="em" type="email" placeholder="email" autocomplete="username">
  <input id="pw" type="password" placeholder="password" autocomplete="current-password">
  <button id="doLogin" data-i18n="signIn">Sign in</button>
  <div id="mfa" class="hide">
    <input id="otp" placeholder="6-digit authenticator code" inputmode="numeric" autocomplete="one-time-code">
    <button id="doOtp" data-i18n="verify">Verify</button>
  </div>
</section>

<div id="app" class="hide">
  <section>
    <h2 data-i18n="project">Project</h2>
    <select id="proj"></select>
    <input id="np" placeholder="new slug">
    <input id="nn" placeholder="name">
    <button id="addProj" data-i18n="addProject">Add project</button>
  </section>
  <section>
    <h2 data-i18n="mode">POS mode</h2>
    <span data-i18n="modeLabel">Mode</span>
    <select id="mode">
      <option value="free-invite">free-invite</option>
      <option value="paid">paid</option>
      <option value="closed">closed</option>
    </select>
    <span data-i18n="paidScope">Paid scope</span>
    <select id="scope">
      <option value="new_only">New members only</option>
      <option value="everyone">Everyone</option>
    </select>
    <label><input type="checkbox" id="paused"> <span data-i18n="stopInvites">Stop invites</span></label>
    <button id="saveCfg" data-i18n="save">Save</button>
  </section>
  <section>
    <h2 data-i18n="invites">Invites</h2>
    <span data-i18n="count">Count</span>
    <input id="n" type="number" value="2" min="1" max="50" style="width:4em">
    <button id="issue" data-i18n="issue">Issue</button>
    <pre id="codes"></pre>
    <table id="invT"></table>
  </section>
  <section>
    <h2 data-i18n="registrations">Registrations</h2>
    <table id="devT"></table>
  </section>
  <section>
    <h2 data-i18n="keys">Premium trial keys</h2>
    <span data-i18n="plan">Plan</span>
    <input id="plan" value="trial" size="8">
    <span data-i18n="days">Days</span>
    <input id="days" type="number" value="14" min="1" max="3650" style="width:4em">
    <button id="mkKey" data-i18n="issue">Issue</button>
    <pre id="keyOut"></pre>
    <table id="keyT"></table>
  </section>
  <section>
    <h2 data-i18n="flags">Feature flags / pricing</h2>
    <input id="fk" placeholder="key e.g. price_monthly">
    <input id="fv" placeholder='JSON value e.g. 3.99'>
    <button id="saveFlag" data-i18n="save">Save</button>
    <table id="flagT"></table>
  </section>
  <section>
    <h2 data-i18n="announcements">Announcements</h2>
    <input id="at" placeholder="title">
    <input id="ab" placeholder="body">
    <button id="addAnn" data-i18n="addDraft">Add (draft)</button>
    <table id="annT"></table>
  </section>
</div>

<!--
  SRI-pinned supabase-js (F7). Replace the integrity hash with the real one:
    curl -sSL https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js \
      | openssl dgst -sha384 -binary | openssl base64 -A
  Version is pinned (not @2) to prevent silent upgrades.
-->
<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"
  integrity="sha384-REPLACE_WITH_REAL_SHA384_BASE64"
  crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
