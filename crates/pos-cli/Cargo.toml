[package]
name = "pos-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "PassAura OS CLI: verify signed allowlists and gate package installs"

[[bin]]
name = "pos-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
pos-gate = { path = "../pos-gate" }
pos-core = { path = "../pos-core" }
pos-install = { path = "../pos-install" }
pos-update = { path = "../pos-update", features = ["file-state"] }
pos-update-install = { path = "../pos-update-install" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
sha2 = "0.10"
