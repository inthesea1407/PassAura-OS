[package]
name = "pos-install"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Crash-safe, allowlist-gated install transaction (journal, advisory lock, exact-file install)"
license = "MIT"

[dependencies]
pos-core = { path = "../pos-core" }
pos-gate = { path = "../pos-gate" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"

[dev-dependencies]
ed25519-dalek = "2"
tempfile = "3"
