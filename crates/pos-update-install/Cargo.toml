[package]
name = "pos-update-install"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Handoff adapter: runs verified, staged update artifacts through the pos-install transaction"
license = "MIT"

[dependencies]
pos-update = { path = "../pos-update" }
pos-install = { path = "../pos-install" }
pos-gate = { path = "../pos-gate" }
serde_json = "1"

[dev-dependencies]
ed25519-dalek = "2"
tempfile = "3"
hex = "0.4"
sha2 = "0.10"
