[package]
name = "pos-update"
version = "0.1.0"
edition = "2021"
description = "Signed update-manifest verification: threshold Ed25519, rollback state, time validity (pure functions, no I/O)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
hex = "0.4"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
proptest = "1"
