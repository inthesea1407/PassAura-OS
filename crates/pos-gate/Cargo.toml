[package]
name = "pos-gate"
version = "0.1.0"
edition = "2021"
description = "Package gate: observes what a package really contains and blocks non-PassAura password managers"
license = "MIT"

[dependencies]
pos-core = { path = "../pos-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
hex = "0.4"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
proptest = "1"
