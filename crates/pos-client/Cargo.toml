[package]
name = "pos-client"
version = "0.1.0"
edition = "2021"
description = "PassAura OS registry and premium redemption client"
license = "MIT"

[features]
default = []
ureq = ["dep:ureq"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = { version = "2", optional = true, default-features = false, features = ["tls"] }

[[example]]
name = "register_cli"
required-features = ["ureq"]
