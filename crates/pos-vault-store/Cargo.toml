[package]
name = "pos-vault-store"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Encrypted single-file store: XChaCha20-Poly1305 or L1 payload, Argon2id-wrapped data key, rewrap-only"
license = "MIT"

[dependencies]
pos-crypto-suites = { path = "../pos-crypto-suites" }
chacha20poly1305 = "0.10"
zeroize = "1"
getrandom = "0.2"

[dev-dependencies]
tempfile = "3"
proptest = "1"
