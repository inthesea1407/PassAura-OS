[package]
name = "pos-fuzz"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
pos-gate = { path = "../crates/pos-gate" }
pos-update = { path = "../crates/pos-update" }
pos-vault-store = { path = "../crates/pos-vault-store" }

[[bin]]
name = "fuzz_allowlist_json"
path = "fuzz_targets/fuzz_allowlist_json.rs"
doc = false

[[bin]]
name = "fuzz_package_name"
path = "fuzz_targets/fuzz_package_name.rs"
doc = false

[[bin]]
name = "fuzz_update_envelope"
path = "fuzz_targets/fuzz_update_envelope.rs"
doc = false

[[bin]]
name = "fuzz_update_channel_key"
path = "fuzz_targets/fuzz_update_channel_key.rs"
doc = false

[[bin]]
name = "fuzz_vault_open"
path = "fuzz_targets/fuzz_vault_open.rs"
doc = false

[[bin]]
name = "fuzz_deb_identity"
path = "fuzz_targets/fuzz_deb_identity.rs"
doc = false
