name: netpolicy-nft
on:
  push:
    paths:
      - "crates/pos-netpolicy/**"
      - "scripts/ci/netpolicy-live.sh"
      - ".github/workflows/netpolicy-nft.yml"
  pull_request:
    paths:
      - "crates/pos-netpolicy/**"
      - "scripts/ci/netpolicy-live.sh"
      - ".github/workflows/netpolicy-nft.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nft-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install nftables
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nftables iproute2
          nft --version
      - name: Generate rule files with pos-netpolicy
        run: |
          mkdir -p /tmp/nftrules
          POS_NFT_OUT_DIR=/tmp/nftrules POS_NFT_UID=48123 cargo test --locked -p pos-netpolicy --test nft_live -- --ignored
          ls -l /tmp/nftrules
      - name: nft -c and namespace enforcement
        run: scripts/ci/netpolicy-live.sh /tmp/nftrules 48123
