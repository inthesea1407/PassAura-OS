name: Image Smoke Build & Verify
# merged: Gemini build/verify + original real-.deb gate test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "image/**"
      - "enforcement/**"
      - "profiles/**"
      - "selinux/**"
      - "policies/**"
      - ".github/workflows/image-smoke.yml"
      - "docs/IMAGE.md"
  pull_request:
    paths:
      - "image/**"
      - "enforcement/**"
      - "profiles/**"
      - "selinux/**"
      - "policies/**"
      - ".github/workflows/image-smoke.yml"
      - "docs/IMAGE.md"

jobs:
  image-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - run: cargo build --release -p pos-gate

      - name: Install free image build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mmdebstrap debootstrap debian-archive-keyring apparmor-utils

      - name: Check SELinux policy tools if installed (non-blocking report)
        run: |
          if command -v checkmodule >/dev/null 2>&1; then
            checkmodule -M -m -o /tmp/passaura_pmgate.mod selinux/passaura_pmgate.te || true
          else
            echo "checkmodule not installed on runner; selinux/passaura_pmgate.te remains an uncompiled draft."
          fi

      - name: Build minimal Debian image
        env:
          DEBIAN_SUITE: bookworm
          DEBIAN_ARCH: amd64
          SOURCE_DATE_EPOCH: "1735689600"
        run: |
          chmod +x image/build.sh image/verify.sh image/bin/pos-register enforcement/apt-hook.sh
          sudo -E env "PATH=$PATH" ./image/build.sh

      - name: Verify built rootfs against hardening profile
        run: |
          ./image/verify.sh out/rootfs

      - name: Smoke test pos-register stub with temporary invite file
        run: |
          TMP_INVITE="$(mktemp)"
          TMP_STATE="$(mktemp -d)"
          printf 'PASSAURA-INVITE-TEST-0001\n' > "${TMP_INVITE}"
          PASSAURA_INVITE_FILE="${TMP_INVITE}" PASSAURA_STATE_DIR="${TMP_STATE}" ./image/bin/pos-register
          test -f "${TMP_STATE}/registration.json"
          rm -rf "${TMP_INVITE}" "${TMP_STATE}"

      - name: Gate test on real .deb (must be blocked)
        run: |
          export PATH=$PWD/target/release:$PATH
          cd /tmp && mkdir -p t/p/DEBIAN t/p/usr/lib/mozilla/native-messaging-hosts
          printf 'Package: sneaky\nVersion: 1\nArchitecture: all\nMaintainer: t <t@t>\nDescription: t\n' > t/p/DEBIAN/control
          echo '{}' > t/p/usr/lib/mozilla/native-messaging-hosts/x.json
          dpkg-deb -b t/p t/sneaky.deb
          if echo /tmp/t/sneaky.deb | sh $GITHUB_WORKSPACE/enforcement/apt-hook.sh; then echo "gate failed to block"; exit 1; fi
