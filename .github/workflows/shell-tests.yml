name: Shell tests
on:
  push:
    paths: ['scripts/**', 'tests/**', 'enforcement/**', 'image/linux/firstboot/**', '.github/workflows/shell-tests.yml']
  pull_request:
    paths: ['scripts/**', 'tests/**', 'enforcement/**', 'image/linux/firstboot/**']
permissions:
  contents: read
jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bats
      - name: verify-release tests (mock minisign, no real crypto)
        run: bats tests/verify-release.bats
      - name: apt-hook tests (mock dpkg-deb and pos-gate)
        run: bats tests/apt-hook.bats
      - name: pos-register tests
        run: bats tests/pos-register.bats
      - name: first-boot tests
        run: sh image/linux/firstboot/test.sh
